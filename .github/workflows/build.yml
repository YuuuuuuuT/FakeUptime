name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH
          
      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/example/fakeuptime
          mkdir -p app/src/main/assets
          echo "com.example.fakeuptime.HookInit" > app/src/main/assets/xposed_init
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://api.xposed.info/" }
              }
          }
          rootProject.name = "FakeUptime"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.fakeuptime'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.fakeuptime"
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FakeUptime">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Spoof System Uptime (+1000h) BruteForce" />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/java/com/example/fakeuptime/HookInit.java
          package com.example.fakeuptime;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;
          
          public class HookInit implements IXposedHookLoadPackage {
              // 1000時間分
              private static final long OFFSET_SECONDS = 1000L * 60 * 60;
              
              @Override
              public void handleLoadPackage(LoadPackageParam lpparam) throws Throwable {
                  if (!"com.android.settings".equals(lpparam.packageName)) return;
                  
                  // アプローチ1: 標準の DateUtils を無条件フック（1引数版）
                  try {
                      XposedHelpers.findAndHookMethod("android.text.format.DateUtils", lpparam.classLoader, "formatElapsedTime", long.class, new XC_MethodHook() {
                          @Override protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                              param.args[0] = (long) param.args[0] + OFFSET_SECONDS;
                          }
                      });
                  } catch (Throwable t) {}
                  
                  // アプローチ2: 標準の DateUtils を無条件フック（2引数版）
                  try {
                      XposedHelpers.findAndHookMethod("android.text.format.DateUtils", lpparam.classLoader, "formatElapsedTime", StringBuilder.class, long.class, new XC_MethodHook() {
                          @Override protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                              param.args[1] = (long) param.args[1] + OFFSET_SECONDS;
                          }
                      });
                  } catch (Throwable t) {}
                  
                  // アプローチ3: SettingsLib 独自の StringUtil を無条件フック (Pixel等で使われる可能性)
                  try {
                      XposedHelpers.findAndHookMethod("com.android.settingslib.utils.StringUtil", lpparam.classLoader, "formatElapsedTime", 
                          android.content.Context.class, double.class, boolean.class, boolean.class, new XC_MethodHook() {
                          @Override protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                              param.args[1] = (double) param.args[1] + (OFFSET_SECONDS * 1000.0);
                          }
                      });
                  } catch (Throwable t) {}
              }
          }
          EOF
          
      - name: Build APK
        run: gradle assembleDebug
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
